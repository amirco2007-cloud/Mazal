name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Stage web files into www/
        run: |
          set -eux
          mkdir -p www/icons
          cp index.html app.js styles.css manifest.json sw.js mazal-native.js www/
          cp -r icons/. www/icons/

      - name: Initialize npm project
        run: |
          set -eux
          npm init -y
          npm pkg set name="mazal-apk-build"
          npm pkg set private=true

      - name: Install Capacitor
        run: |
          set -eux
          npm install --save @capacitor/core@^6 @capacitor/android@^6
          npm install --save-dev @capacitor/cli@^6 @capacitor/assets@^3

      - name: Write capacitor.config.json
        run: |
          set -eux
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.mazal.app",
            "appName": "Mazal",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
          cat capacitor.config.json

      - name: Add Android platform
        run: npx --yes cap add android

      - name: Inject native sources and patch manifest
        run: python3 native/inject.py

      - name: Generate Android icons from icon-512.png
        run: |
          set -eux
          mkdir -p assets
          # @capacitor/assets prefers a 1024x1024 icon; resize using sharp via npx
          cp icons/icon-512.png assets/icon.png
          # Try to upscale to 1024 if ImageMagick is available; otherwise leave 512.
          if command -v convert >/dev/null 2>&1; then
            convert assets/icon.png -resize 1024x1024 assets/icon.png
          fi
          npx --yes @capacitor/assets generate --android --assetPath assets || \
            echo "Icon generation failed - continuing with default icons"

      - name: Sync Capacitor (copy web assets into android project)
        run: npx --yes cap sync android

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          set -eux
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename built APK
        id: apk
        run: |
          set -eux
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" mazal.apk
          ls -la mazal.apk
          echo "path=mazal.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mazal-apk
          path: mazal.apk
          if-no-files-found: error

      - name: Delete previous apk-latest release (ignore if missing)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh release delete apk-latest --yes --cleanup-tag --repo "${{ github.repository }}"
          exit 0

      - name: Publish APK to rolling release (apk-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Mazal APK
          body: |
            Automatic debug build of the Mazal Android APK.

            Built from commit ${{ github.sha }} on ${{ github.ref_name }}.

            Install on Android: download mazal.apk, open it, allow "Install unknown apps" if prompted.
          files: mazal.apk
          prerelease: false
          make_latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
