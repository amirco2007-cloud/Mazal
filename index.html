<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9B2C2C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מזל">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>מזל קל לדרך</title>
</head>
<body>
  <button id="open-settings" type="button" class="btn-gear" aria-label="הגדרות">⚙</button>

  <main class="app">
    <h1 class="title">מזל קל לדרך</h1>

    <p id="intercept-note" class="intercept-note" hidden></p>

    <div class="mode" role="radiogroup" aria-label="סוג ההרגל">
      <button type="button" class="mode-btn active" role="radio" aria-checked="true" data-mode="avoid">הרגל להימנע</button>
      <button type="button" class="mode-btn" role="radio" aria-checked="false" data-mode="start">הרגל להתחיל</button>
    </div>

    <input
      id="numbers"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      aria-label="מספרים בין 1 ל-10"
      placeholder="מספרים 1–10 (למשל 3, 7, 9)">

    <button id="draw" type="button" class="btn-draw" disabled>הגרל</button>

    <section id="result" class="result" role="status" aria-live="polite"></section>

    <button id="continue-app" type="button" class="btn-continue" hidden></button>
    <button id="reset" type="button" class="btn-reset" hidden>סבב חדש</button>
  </main>

  <section id="settings" class="settings" hidden>
    <div class="settings-inner">
      <h2 class="settings-title">אפליקציות שיפעילו את מזל</h2>
      <p id="perm-warning" class="perm-warning" hidden>
        יש להפעיל הרשאת נגישות כדי שמזל יקפוץ לפני אפליקציות.
        <button id="grant-perm" type="button" class="btn-grant">הפעלת הרשאה</button>
      </p>
      <ul id="app-list" class="app-list" aria-label="רשימת אפליקציות"></ul>
      <div class="settings-actions">
        <button id="save-settings" type="button" class="btn-draw">שמירה</button>
        <button id="close-settings" type="button" class="btn-reset">סגירה</button>
      </div>
    </div>
  </section>

  <script src="./mazal-native.js"></script>
  <script src="./app.js"></script>
</body>
</html>
