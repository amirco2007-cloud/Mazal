<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9B2C2C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מזל">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>מזל קל לדרך</title>
</head>
<body>
  <main class="app">
    <h1 class="title">מזל קל לדרך</h1>

    <div class="mode" role="radiogroup" aria-label="סוג ההרגל">
      <button type="button" class="mode-btn active" role="radio" aria-checked="true" data-mode="avoid">הרגל להימנע</button>
      <button type="button" class="mode-btn" role="radio" aria-checked="false" data-mode="start">הרגל להתחיל</button>
    </div>

    <input
      id="numbers"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      spellcheck="false"
      aria-label="מספרים בין 1 ל-10"
      placeholder="מספרים 1–10 (למשל 3, 7, 9)">

    <button id="draw" type="button" class="btn-draw" disabled>הגרל</button>

    <section id="result" class="result" role="status" aria-live="polite"></section>

    <button id="reset" type="button" class="btn-reset" hidden>סבב חדש</button>
  </main>

  <script src="./app.js"></script>
</body>
</html>
